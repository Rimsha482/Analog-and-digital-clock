<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analog + Digital Clock</title>
  <style>
    :root {
      --bg: #0f1220;
      --card: #171a2b;
      --ring: #242842;
      --text: #e8ecff;
      --muted: #9aa3c7;
      --acc: #6ea8fe;
      --sec: #ff6b6b;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(1200px 800px at 80% -20%, #1c2141 0%, #0f1220 60%);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
    }

    .wrap {
      width: min(920px, 92vw);
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 800px) {
      .wrap {
        grid-template-columns: 520px 1fr;
        align-items: center;
      }
    }

    .card {
      background: linear-gradient(180deg, var(--card), #121528);
      border: 1px solid #22274a;
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 20px;
    }

    /* ===== Analog clock ===== */
    .clock {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, #1c2142, #14172b 64%),
        conic-gradient(from 0deg, #2b2f52 0 25%, #212448 0 50%, #2b2f52 0 75%, #212448 0 100%);
      border: 10px solid var(--ring);
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    /* hour markers */
    .tick { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; }
    .tick::before {
      content: "";
      display: block;
      height: 10px; width: 3px;
      background: #c7d2ff;
      border-radius: 2px;
      transform: translate(-1.5px, -190px); /* moved out from center */
      opacity: .9;
    }
    .tick.major::before { height: 16px; width: 4px; transform: translate(-2px, -186px); opacity: 1; }

    /* hands */
    .hand { position: absolute; left: 50%; top: 50%; transform-origin: 50% 95%; }
    .hand.hour {
      width: 10px; height: 34%;
      background: linear-gradient(#f3f6ff, #9aa3c7);
      border-radius: 12px; translate: -50% -90%;
      box-shadow: 0 2px 8px rgba(0,0,0,.25) inset;
    }
    .hand.minute {
      width: 8px; height: 44%;
      background: linear-gradient(#f3f6ff, #aab4da);
      border-radius: 10px; translate: -50% -90%;
    }
    .hand.second {
      width: 3px; height: 48%;
      background: var(--sec);
      translate: -50% -90%;
    }

    .cap {
      position: absolute; left: 50%; top: 50%; translate: -50% -50%;
      width: 16px; height: 16px; border-radius: 50%;
      background: #dbe4ff; box-shadow: inset 0 0 0 3px #95a6f3, 0 2px 10px rgba(0,0,0,.4);
      z-index: 2;
    }

    .brand { position: absolute; left: 50%; top: 58%; translate: -50% -50%; font-weight: 600; letter-spacing: .1em; color: var(--muted); font-size: .68rem; }

    /* ===== Digital area ===== */
    .digital {
      display: grid;
      gap: 8px;
      align-content: center;
      justify-items: center;
      padding: 24px;
    }
    .time {
      font-size: clamp(36px, 7vw, 64px);
      font-weight: 700;
      letter-spacing: .04em;
      line-height: 1;
    }
    .date { color: var(--muted); font-size: clamp(13px, 2.5vw, 14px); }

    .controls { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
    .switch {
      display: inline-grid; grid-template-columns: 42px auto; gap: 10px; align-items: center;
      font-size: 14px; color: var(--muted);
    }
    .toggle {
      appearance: none; width: 42px; height: 24px; border-radius: 999px; position: relative;
      background: #2a2e52; outline: none; cursor: pointer; transition: background .2s ease;
    }
    .toggle::after {
      content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px;
      background: white; border-radius: 50%; transition: transform .2s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,.35);
    }
    .toggle:checked { background: #3a7afe; }
    .toggle:checked::after { transform: translateX(18px); }

    .hint { color: var(--muted); font-size: 12px; text-align: center; margin-top: 6px; }

    /* smooth sweeping second hand */
    .hand.second { transition: transform .06s linear; }
    .hand.minute, .hand.hour { transition: transform .2s cubic-bezier(.2,.8,.2,1); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="clock" id="analog">
        <!-- ticks injected by JS -->
        <div class="hand hour" id="h"></div>
        <div class="hand minute" id="m"></div>
        <div class="hand second" id="s"></div>
        <div class="cap"></div>
        <div class="brand">DIGIT+ANALOG</div>
      </div>
    </div>

    <div class="card digital">
      <div class="time" id="time">00:00:00</div>
      <div class="date" id="date">—</div>
      <div class="controls">
        <label class="switch"><input id="t24" class="toggle" type="checkbox"/> 24‑hour</label>
      </div>
      <div class="hint">Tip: toggle 24‑hour. Works offline and uses your device time.</div>
    </div>
  </div>

  <script>
    // --- create 60 ticks around the dial (with 12 major ones) ---
    const dial = document.getElementById('analog');
    for (let i = 0; i < 60; i++) {
      const t = document.createElement('div');
      t.className = 'tick' + (i % 5 === 0 ? ' major' : '');
      t.style.transform = `translate(-50%, -50%) rotate(${i * 6}deg)`;
      dial.appendChild(t);
    }

    const el = {
      h: document.getElementById('h'),
      m: document.getElementById('m'),
      s: document.getElementById('s'),
      time: document.getElementById('time'),
      date: document.getElementById('date'),
      t24: document.getElementById('t24')
    };

    const pad = (n) => String(n).padStart(2, '0');

    function update() {
      const now = new Date();
      const ms = now.getMilliseconds();
      const sec = now.getSeconds() + ms / 1000;
      const min = now.getMinutes() + sec / 60;
      const hr = now.getHours() % 12 + min / 60;

      // rotate hands (deg per unit: sec=6, min=6, hr=30)
      el.s.style.transform = `rotate(${sec * 6}deg)`;
      el.m.style.transform = `rotate(${min * 6}deg)`;
      el.h.style.transform = `rotate(${hr * 30}deg)`;

      // digital
      const use24 = el.t24.checked;
      let H = now.getHours();
      let suffix = '';
      if (!use24) {
        suffix = H >= 12 ? ' PM' : ' AM';
        H = H % 12 || 12; // 12‑hour
      }
      el.time.textContent = `${pad(H)}:${pad(now.getMinutes())}:${pad(Math.floor(sec))}${suffix}`;

      // date
      const opts = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
      el.date.textContent = now.toLocaleDateString(undefined, opts);

      requestAnimationFrame(update);
    }

    update();
  </script>
</body>
</html>
